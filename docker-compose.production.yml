services:
  postgres:
    image: postgres:16-alpine
    container_name: codeautopsy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: legacy_copilot
      POSTGRES_USER: legacy_copilot
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legacy_copilot -d legacy_copilot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - app

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app

  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./deploy/runtime.env
      - ./deploy/llm.env
    environment:
      DATABASE_URL: postgresql://legacy_copilot:${DB_PASSWORD}@postgres:5432/legacy_copilot
      DATABASE_TYPE: postgresql
      REDIS_URL: redis://redis:6379/0
      STORAGE_TYPE: local
      UPLOAD_DIR: /app/uploads
      TEMP_DIR: /app/temp
      ENVIRONMENT: production
      DEBUG: "false"
      ALLOWED_ORIGINS: "*"
      ALLOW_CREDENTIALS: "false"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/temp:/app/temp
      - ./data/logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - app

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - app

volumes:
  postgres_data:
  redis_data:

networks:
  app:
