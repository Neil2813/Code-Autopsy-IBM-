AWSTemplateFormatVersion: "2010-09-09"
Description: Code Autopsy single-instance deployment with HTTPS CloudFront, persistent storage, and S3 backups.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC that contains the public subnet.
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Public subnet in the default VPC.
  AmiId:
    Type: AWS::EC2::Image::Id
    Description: Amazon Linux 2023 x86_64 AMI in this region.
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues:
      - t3.medium
      - t3.large
    Description: Backend, database, Redis, and frontend run on this instance.
  ArtifactBucket:
    Type: String
    Description: Private S3 bucket containing the deployment source archive.
  ArtifactKey:
    Type: String
    Description: S3 object key for the deployment source archive.
  CloudFrontOriginPrefixListId:
    Type: String
    Description: AWS-managed CloudFront origin-facing prefix list ID for this region.

Resources:
  BackupBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpireBackups
            Status: Enabled
            Prefix: backups/
            ExpirationInDays: 30
            NoncurrentVersionExpiration:
              NoncurrentDays: 7

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: CodeAutopsyArtifactsAndBackups
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${ArtifactBucket}/${ArtifactKey}
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${BackupBucket}/backups/*
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Sub arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:codeautopsy/llm-*

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref InstanceRole

  ApplicationSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP origin traffic only from CloudFront.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontOriginPrefixListId
          Description: CloudFront origin-facing network only
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: codeautopsy-origin

  ApplicationInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref AmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !GetAtt ApplicationSecurityGroup.GroupId
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeSize: 50
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: false
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail
          dnf install -y awscli unzip
          mkdir -p /opt/codeautopsy
          aws s3 cp "s3://${ArtifactBucket}/${ArtifactKey}" /tmp/codeautopsy-deploy.zip --region "${AWS::Region}"
          unzip -q /tmp/codeautopsy-deploy.zip -d /opt/codeautopsy
          rm -f /tmp/codeautopsy-deploy.zip
          BACKUP_BUCKET="${BackupBucket}" AWS_REGION="${AWS::Region}" bash /opt/codeautopsy/deploy/instance-setup.sh
      Tags:
        - Key: Name
          Value: codeautopsy-app

  ApplicationElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      InstanceId: !Ref ApplicationInstance
      Tags:
        - Key: Name
          Value: codeautopsy-origin

  HttpsDistribution:
    Type: AWS::CloudFront::Distribution
    DependsOn:
      - ApplicationElasticIp
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Code Autopsy HTTPS frontend and API
        PriceClass: PriceClass_100
        HttpVersion: http2
        Origins:
          - Id: CodeAutopsyOrigin
            DomainName: !GetAtt ApplicationInstance.PublicDnsName
            CustomOriginConfig:
              HTTPPort: 80
              OriginReadTimeout: 120
              OriginProtocolPolicy: http-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: CodeAutopsyOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac
          Compress: true
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Restrictions:
          GeoRestriction:
            RestrictionType: none
      Tags:
        - Key: Name
          Value: codeautopsy-https

  InstanceRecoveryAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Recover the Code Autopsy instance after a host system-check failure.
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed_System
      Dimensions:
        - Name: InstanceId
          Value: !Ref ApplicationInstance
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: missing
      AlarmActions:
        - !Sub arn:${AWS::Partition}:automate:${AWS::Region}:ec2:recover

Outputs:
  ApplicationUrl:
    Description: HTTPS application URL. Wait for CloudFront deployment before using it.
    Value: !Sub https://${HttpsDistribution.DomainName}
  CloudFrontDistributionId:
    Value: !Ref HttpsDistribution
  InstanceId:
    Value: !Ref ApplicationInstance
  BackupBucketName:
    Value: !Ref BackupBucket
